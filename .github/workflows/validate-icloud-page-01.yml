name: Validate iCloud Library page 01

on:
  push:
    paths:
      - '.github/workflows/validate-icloud-page-01.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve public iCloud share and verify archive
        shell: bash
        env:
          ICLOUD_GUID: 0ebjMriB2d30JCT2CgJjVvQ8A
          EXPECTED_SHA256: 2847414f5c338221077a2b0615ab69741512f4e020a02de9235b6add5e67a14c
          EXPECTED_SIZE: '187432960'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          endpoint='https://ckdatabasews.icloud.com/database/1/com.apple.cloudkit/production/public/records/resolve'
          payload=json.dumps({'shortGUIDs':[{'value':os.environ['ICLOUD_GUID']}]}).encode()
          req=urllib.request.Request(endpoint,data=payload,headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              data=json.load(r)
          value=data['results'][0]['rootRecord']['fields']['fileContent']['value']
          url=value['downloadURL']
          print('Resolved iCloud share')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=120) as src, open('/tmp/page-01.tar','wb') as dst:
              while True:
                  chunk=src.read(1024*1024)
                  if not chunk: break
                  dst.write(chunk)
          PY
          test "$(stat -c '%s' /tmp/page-01.tar)" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  /tmp/page-01.tar" | sha256sum -c -
          test "$(tar -tf /tmp/page-01.tar | wc -l)" = '84'
          echo 'iCloud archive validated successfully'
